name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax (all scripts)
        run: |
          for f in scripts/*.py; do
            echo "  py_compile $f"
            python3 -m py_compile "$f"
          done

      - name: Check shell syntax (all scripts)
        run: |
          for f in scripts/*.sh; do
            echo "  bash -n $f"
            bash -n "$f"
          done

      - name: Run unit tests
        run: |
          pip install pytest
          python3 -m pytest tests/test_server.py -v -k "not Integration"

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - id: deployment
        uses: actions/deploy-pages@v4
